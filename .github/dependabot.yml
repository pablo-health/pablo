version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Update poetry.lock rather than widening the pyproject constraints.
    # A constraint-range PR ("update fastapi requirement from >=0.138.1 to
    # >=0.140.0") names no versions at all, which leaves a reviewer unable
    # to tell a patch from a major; lock-file updates carry the real ones.
    # Widening a constraint to admit a new major stays a deliberate manual
    # change; security advisories still open their own PRs.
    versioning-strategy: lockfile-only
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The transcription worker's hashed lock (services/transcription/
  # requirements.txt, compiled from requirements.in with `uv pip compile`).
  # The uv ecosystem, not pip: it re-runs `uv pip compile` against
  # requirements.in, so the floors and the av ceiling there hold, and it keeps
  # --generate-hashes and --python-version from the lock's header. It does not
  # carry --python-platform over; Dependabot resolves on x86_64 Linux, the
  # image's platform, and CI's "Transcription lock decode" job installs the
  # result as the image does and runs the worker's real decode.
  - package-ecosystem: uv
    directory: /services/transcription
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Mirrors the av<19 ceiling in requirements.in: faster-whisper 1.2.1
      # calls av.open(metadata_errors=...), which PyAV 19 rejects, so every
      # transcription fails. Lift both together once faster-whisper supports
      # PyAV 19.
      - dependency-name: "av"
        versions: [">=19"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint 10 is blocked by eslint-plugin-import (pulled in via
      # eslint-config-next), whose peer dependency caps at eslint 9. The bump
      # can't install, so Dependabot just re-opens an un-mergeable PR. Remove
      # this once eslint-plugin-import ships eslint-10 support.
      - dependency-name: "eslint"
        versions: [">=10"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
