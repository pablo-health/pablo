version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Update poetry.lock rather than widening the pyproject constraints.
    # A constraint-range PR ("update fastapi requirement from >=0.138.1 to
    # >=0.140.0") reports no version metadata at all — update-type is null
    # and previous-version/new-version are empty — so the auto-merge
    # workflow cannot tell a patch from a major and skips the PR silently.
    # Lock-file updates carry real versions, so they classify correctly.
    # Widening a constraint to admit a new major stays a deliberate manual
    # change; security advisories still open their own PRs.
    versioning-strategy: lockfile-only
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint 10 is blocked by eslint-plugin-import (pulled in via
      # eslint-config-next), whose peer dependency caps at eslint 9. The bump
      # can't install, so Dependabot just re-opens an un-mergeable PR. Remove
      # this once eslint-plugin-import ships eslint-10 support.
      - dependency-name: "eslint"
        versions: [">=10"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
