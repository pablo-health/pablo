name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".beads/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".beads/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check version sync
        run: bash scripts/check-version-sync.sh

      - name: Check PHI not passed to logger.* calls (THERAPY-za2y)
        run: python3 scripts/check_phi_in_logs.py

  migration-lint:
    name: Models ship with migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check models ship with migrations (guardrail #4)
        run: python .claude/skills/migration-lint/check.py --base origin/${{ github.base_ref }}

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry virtualenv location
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Audit Python dependencies
        run: |
          pipx inject poetry poetry-plugin-export
          poetry export --only=main --without-hashes -f requirements.txt -o /tmp/requirements-audit.txt
          pipx run pip-audit -r /tmp/requirements-audit.txt --no-deps --disable-pip

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Alembic single-head check
        # Two PRs that each add a migration off the same parent will
        # silently produce two heads and break ``alembic upgrade head``
        # for every downstream consumer (most painfully, pablo-saas's
        # ``saas.bin.migrate``). Catch it at PR time instead of after
        # the merge.
        run: |
          cd backend
          heads=$(poetry run alembic heads | grep -c "(head)")
          if [ "$heads" -ne 1 ]; then
            echo "::error::Alembic has $heads heads — needs a merge migration."
            echo "::error::Run \`poetry run alembic merge -m '<msg>' heads\` and commit the generated revision."
            poetry run alembic heads
            exit 1
          fi
          echo "Single head, good."

      - name: Test (pytest)
        run: cd backend && poetry run pytest tests/ -m "not spacy" --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=67

  backend-integration:
    name: Backend integration (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry virtualenv location
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      # Postgres comes up via testcontainers — see
      # backend/tests_integration/conftest.py. Docker is preinstalled on
      # ubuntu-latest runners; no extra setup needed. The conftest
      # provisions a non-superuser ``pablo`` role (NOSUPERUSER
      # NOBYPASSRLS) so the tenant-isolation / RLS-invariant suite
      # actually exercises row-level security rather than silently
      # passing as a superuser.
      #
      # Runs the full suite via ``make test-integration`` — the
      # cross-tenant isolation and RLS-invariant tests
      # (tests_integration/database/test_tenant_isolation.py,
      # test_rls_invariants.py) gate every merge. Two modules with
      # documented pre-existing breakage are skipped at the module
      # level (THERAPY-o1zh soft-delete uuid drift, THERAPY-n0ac
      # tenant-fan-out semantics); re-enable them as those issues close.
      - name: Cache Postgres test image
        uses: actions/cache@v5
        with:
          path: ~/.cache/tc-images
          key: tc-image-postgres-16-alpine

      - name: Load or pull Postgres test image
        # testcontainers pulls postgres:16-alpine from Docker Hub at test
        # time; on shared runners that pull can hit anonymous rate limits
        # and fail the create with a 404 ("no such image"). Restore from
        # cache when present, otherwise pull once (with retries) and save
        # for the next run so the suite never depends on a live pull.
        run: |
          img=postgres:16-alpine
          tar="$HOME/.cache/tc-images/postgres-16-alpine.tar"
          if [ -f "$tar" ]; then
            docker load -i "$tar"
          else
            mkdir -p "$(dirname "$tar")"
            for i in 1 2 3; do docker pull "$img" && break || sleep 5; done
            docker save "$img" -o "$tar"
          fi

      - name: Run integration tests
        run: make test-integration

  tenant-template-drift:
    # Catches the failure mode that produced the 2026-05-19 incident:
    # an alembic revision lands without ``tenant_template.sql`` being
    # regenerated, so fresh-tenant provisioning (which applies the
    # template verbatim) emits a different schema than alembic head.
    # The regen script runs alembic upgrade head + pg_dump in a
    # disposable Postgres via testcontainers; we then ``git diff``
    # the committed template against the regen output.
    name: Tenant template matches alembic head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry virtualenv location
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Cache Postgres test image
        uses: actions/cache@v5
        with:
          path: ~/.cache/tc-images
          key: tc-image-postgres-16-alpine

      - name: Load or pull Postgres test image
        # Shares the cache key with the integration job above — whichever
        # runs first populates the tarball; both restore it and skip the
        # Docker Hub pull on a cache hit.
        run: |
          img=postgres:16-alpine
          tar="$HOME/.cache/tc-images/postgres-16-alpine.tar"
          if [ -f "$tar" ]; then
            docker load -i "$tar"
          else
            mkdir -p "$(dirname "$tar")"
            for i in 1 2 3; do docker pull "$img" && break || sleep 5; done
            docker save "$img" -o "$tar"
          fi

      - name: Regenerate template (testcontainers Postgres)
        run: poetry run python backend/scripts/regen_tenant_template.py

      - name: Fail if template drifted from alembic head
        run: |
          if ! git diff --exit-code backend/app/db/tenant_template.sql; then
            echo "::error::tenant_template.sql is out of sync with alembic head."
            echo "::error::Run: poetry run python backend/scripts/regen_tenant_template.py"
            echo "::error::Then commit the updated backend/app/db/tenant_template.sql."
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # --audit-signatures verifies each package's npm registry signature
        # before install, catching account-takeover republishes that share
        # a pinned version. See docs (pablo-saas)
        # docs/internal/vendor-verification/supply-chain-review-2026-05-19.md.
        run: npm ci --audit-signatures
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run
