name: CI

# Deliberately no `paths-ignore`. It suppresses the whole run, so the checks
# this workflow owns never report — and several of them are required by
# branch protection, which leaves such a pull request unmergeable rather than
# cheap. Jobs instead classify the diff themselves (scripts/ci_classify_diff.sh)
# and skip the work while still reporting green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version sync
        run: bash scripts/check-version-sync.sh

      - name: Check PHI not passed to logger.* calls (THERAPY-za2y)
        run: python3 scripts/check_phi_in_logs.py

  migration-lint:
    name: Models ship with migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check models ship with migrations (guardrail #4)
        run: python .claude/skills/migration-lint/check.py --base origin/${{ github.base_ref }}

  public-content:
    name: Public content
    # This repository is public and a merge cannot be undone, so the small set
    # of strings that are never right here is checked mechanically rather than
    # remembered. Deliberately narrow: only patterns the tree is already clean
    # of, because a check that fires against normal work gets muted.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs history back to the PR base to diff against it.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check public content
        run: python backend/scripts/check_public_content.py --diff-base origin/${{ github.base_ref }}

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - uses: actions/checkout@v7
        with:
          # Need history back to the PR base for the classify step below.
          fetch-depth: 0

      - id: classify
        # Self-contained rather than a shared `needs:` job: a skipped
        # dependency skips its dependents, and the classification only makes
        # sense for a pull request. When this step does not run, `substantive`
        # is '' and every gate below fails open to doing the full job.
        if: github.event_name == 'pull_request'
        run: bash scripts/ci_classify_diff.sh "origin/${{ github.base_ref }}"

      - uses: actions/setup-python@v7
        if: steps.classify.outputs.substantive != 'false'
        with:
          python-version: "3.13"

      - name: Install Poetry
        if: steps.classify.outputs.substantive != 'false'
        run: pipx install poetry

      - name: Configure Poetry virtualenv location
        if: steps.classify.outputs.substantive != 'false'
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        if: steps.classify.outputs.substantive != 'false'
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.classify.outputs.substantive != 'false'
        run: poetry install --no-interaction --no-ansi

      - name: Audit Python dependencies
        if: steps.classify.outputs.substantive != 'false'
        run: |
          pipx inject poetry poetry-plugin-export
          poetry export --only=main --without-hashes -f requirements.txt -o /tmp/requirements-audit.txt
          pipx run pip-audit -r /tmp/requirements-audit.txt --no-deps --disable-pip

      - name: Lint (ruff + mypy)
        if: steps.classify.outputs.substantive != 'false'
        run: make lint

      - name: Alembic single-head check
        if: steps.classify.outputs.substantive != 'false'
        # Two PRs that each add a migration off the same parent will
        # silently produce two heads and break ``alembic upgrade head``
        # for every downstream consumer. Catch it at PR time instead of
        # after the merge.
        run: |
          cd backend
          heads=$(poetry run alembic heads | grep -c "(head)")
          if [ "$heads" -ne 1 ]; then
            echo "::error::Alembic has $heads heads — needs a merge migration."
            echo "::error::Run \`poetry run alembic merge -m '<msg>' heads\` and commit the generated revision."
            poetry run alembic heads
            exit 1
          fi
          echo "Single head, good."

      - name: Test (pytest)
        if: steps.classify.outputs.substantive != 'false'
        run: cd backend && poetry run pytest tests/ -m "not spacy" --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=67

  backend-integration:
    name: Backend integration (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history back to the PR base for the classify step below.
          fetch-depth: 0

      - id: classify
        # See the note in the backend job — self-contained and fails open.
        if: github.event_name == 'pull_request'
        run: bash scripts/ci_classify_diff.sh "origin/${{ github.base_ref }}"

      - uses: actions/setup-python@v7
        if: steps.classify.outputs.substantive != 'false'
        with:
          python-version: "3.13"

      - name: Install Poetry
        if: steps.classify.outputs.substantive != 'false'
        run: pipx install poetry

      - name: Configure Poetry virtualenv location
        if: steps.classify.outputs.substantive != 'false'
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        if: steps.classify.outputs.substantive != 'false'
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.classify.outputs.substantive != 'false'
        run: poetry install --no-interaction --no-ansi

      # Postgres comes up via testcontainers — see
      # backend/tests_integration/conftest.py. Docker is preinstalled on
      # ubuntu-latest runners; no extra setup needed. The conftest
      # provisions a non-superuser ``pablo`` role (NOSUPERUSER
      # NOBYPASSRLS) so the tenant-isolation / RLS-invariant suite
      # actually exercises row-level security rather than silently
      # passing as a superuser.
      #
      # Runs the full suite via ``make test-integration`` — the
      # cross-tenant isolation and RLS-invariant tests
      # (tests_integration/database/test_tenant_isolation.py,
      # test_rls_invariants.py) gate every merge. Two modules with
      # documented pre-existing breakage are skipped at the module
      # level (THERAPY-o1zh soft-delete uuid drift, THERAPY-n0ac
      # tenant-fan-out semantics); re-enable them as those issues close.
      - name: Cache Postgres test image
        if: steps.classify.outputs.substantive != 'false'
        uses: actions/cache@v6
        with:
          path: ~/.cache/tc-images
          key: tc-image-postgres-16-alpine

      - name: Load or pull Postgres test image
        if: steps.classify.outputs.substantive != 'false'
        # testcontainers pulls postgres:16-alpine from Docker Hub at test
        # time; on shared runners that pull can hit anonymous rate limits
        # and fail the create with a 404 ("no such image"). Restore from
        # cache when present, otherwise pull once (with retries) and save
        # for the next run so the suite never depends on a live pull.
        run: |
          img=postgres:16-alpine
          tar="$HOME/.cache/tc-images/postgres-16-alpine.tar"
          if [ -f "$tar" ]; then
            docker load -i "$tar"
          else
            mkdir -p "$(dirname "$tar")"
            for i in 1 2 3; do docker pull "$img" && break || sleep 5; done
            docker save "$img" -o "$tar"
          fi

      - name: Run integration tests
        if: steps.classify.outputs.substantive != 'false'
        run: make test-integration

  tenant-template-drift:
    # Catches the failure mode that produced the 2026-05-19 incident:
    # an alembic revision lands without ``tenant_template.sql`` being
    # regenerated, so fresh-tenant provisioning (which applies the
    # template verbatim) emits a different schema than alembic head.
    # The regen script runs alembic upgrade head + pg_dump in a
    # disposable Postgres via testcontainers; we then ``git diff``
    # the committed template against the regen output.
    name: Tenant template matches alembic head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history back to the PR base for the classify step below.
          fetch-depth: 0

      - id: classify
        # See the note in the backend job — self-contained and fails open.
        if: github.event_name == 'pull_request'
        run: bash scripts/ci_classify_diff.sh "origin/${{ github.base_ref }}"

      - uses: actions/setup-python@v7
        if: steps.classify.outputs.substantive != 'false'
        with:
          python-version: "3.13"

      - name: Install Poetry
        if: steps.classify.outputs.substantive != 'false'
        run: pipx install poetry

      - name: Configure Poetry virtualenv location
        if: steps.classify.outputs.substantive != 'false'
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        if: steps.classify.outputs.substantive != 'false'
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.classify.outputs.substantive != 'false'
        run: poetry install --no-interaction --no-ansi

      - name: Cache Postgres test image
        if: steps.classify.outputs.substantive != 'false'
        uses: actions/cache@v6
        with:
          path: ~/.cache/tc-images
          key: tc-image-postgres-16-alpine

      - name: Load or pull Postgres test image
        if: steps.classify.outputs.substantive != 'false'
        # Shares the cache key with the integration job above — whichever
        # runs first populates the tarball; both restore it and skip the
        # Docker Hub pull on a cache hit.
        run: |
          img=postgres:16-alpine
          tar="$HOME/.cache/tc-images/postgres-16-alpine.tar"
          if [ -f "$tar" ]; then
            docker load -i "$tar"
          else
            mkdir -p "$(dirname "$tar")"
            for i in 1 2 3; do docker pull "$img" && break || sleep 5; done
            docker save "$img" -o "$tar"
          fi

      - name: Regenerate template (testcontainers Postgres)
        if: steps.classify.outputs.substantive != 'false'
        run: poetry run python backend/scripts/regen_tenant_template.py

      - name: Fail if template drifted from alembic head
        if: steps.classify.outputs.substantive != 'false'
        run: |
          if ! git diff --exit-code backend/app/db/tenant_template.sql; then
            echo "::error::tenant_template.sql is out of sync with alembic head."
            echo "::error::Run: poetry run python backend/scripts/regen_tenant_template.py"
            echo "::error::Then commit the updated backend/app/db/tenant_template.sql."
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history back to the PR base for the classify step below.
          fetch-depth: 0

      - id: classify
        # See the note in the backend job — self-contained and fails open.
        # `working-directory: frontend` is set for this job, so reach back up
        # to the repository root for the script and the diff.
        if: github.event_name == 'pull_request'
        working-directory: .
        run: bash scripts/ci_classify_diff.sh "origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v7
        if: steps.classify.outputs.substantive != 'false'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.classify.outputs.substantive != 'false'
        # --audit-signatures verifies each package's npm registry signature
        # before install, catching account-takeover republishes that share
        # a pinned version.
        run: npm ci --audit-signatures
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      # Audit what ships. Build and lint tooling is not part of the running
      # application, and advisories in that tree (a DoS in eslint's config
      # globbing, say) would otherwise block product changes while npm's only
      # suggested remedy is a --force major downgrade of the linter.
      # Dependabot still opens PRs for dev dependencies.
      - name: Audit npm dependencies
        if: steps.classify.outputs.substantive != 'false'
        run: npm audit --audit-level=high --omit=dev

      - name: Type check
        if: steps.classify.outputs.substantive != 'false'
        run: npx tsc --noEmit

      - name: Lint
        if: steps.classify.outputs.substantive != 'false'
        run: npm run lint

      - name: Test
        if: steps.classify.outputs.substantive != 'false'
        run: npm run test -- --run

      # The same command Dockerfile.production runs, with the same
      # placeholder key (the real one is injected at runtime on Cloud Run).
      # Until this step existed, `next build` ran for the first time in
      # release.yml, AFTER merge — so a config or module-graph error left
      # main red and the image unbuildable rather than failing the PR that
      # introduced it. That is exactly how #868 shipped a route source Next
      # refuses to parse, and four more merges landed on top before anyone
      # looked at the release run. tsc/lint/vitest cannot cover this: none of
      # them evaluate next.config.ts or resolve the graph the way the build
      # does.
      - name: Build
        if: steps.classify.outputs.substantive != 'false'
        run: npm run build
        env:
          AUTH_COOKIE_SIGNATURE_KEY: build-time-placeholder-replaced-at-runtime
