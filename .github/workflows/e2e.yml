name: End-to-end

# A browser driving the whole stack from docker-compose.e2e.yml: the
# production frontend bundle, the API, Postgres, the Firebase Auth emulator
# and the fake clearinghouse. No cloud project, no vendor credentials.
# Design: docs/design/e2e-harness.md.
#
# Pull requests run the suite only for relevant paths. Main image workflows
# call this workflow directly, so no image is built or pushed unless the
# complete deterministic browser suite passes for that exact commit.
on:
  workflow_call:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/app/routes/**"
      - "backend/app/main.py"
      - "docker-compose*.yml"
      - ".env.e2e"
      - "scripts/fake_clearinghouse.py"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose -f docker-compose.e2e.yml up --build --wait

      - name: Run the suite
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --timestamps

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
