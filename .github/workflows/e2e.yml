name: End-to-end

# A browser driving the whole stack from docker-compose.e2e.yml: the
# production frontend bundle, the API, Postgres, the Firebase Auth emulator,
# the fake clearinghouse and the fake mail server. No cloud project, no
# vendor credentials.
# Design: docs/design/e2e-harness.md.
#
# Pull requests run the suite only for relevant paths. Main image workflows
# call this workflow directly, so no image is built or pushed unless the
# complete deterministic browser suite passes for that exact commit.
on:
  workflow_call:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    # NO paths filter: this workflow owns a required check. The classify job
    # skips expensive work for ignorable changes while the gate still reports.

permissions:
  contents: read

# The prefix keeps this reusable workflow from cancelling its CI sibling when
# both are called by the same deploy or release run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify end-to-end changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.result.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        if: github.event_name == 'pull_request'
        run: bash scripts/ci_classify_diff.sh "origin/${{ github.base_ref }}"

      - id: result
        env:
          SUBSTANTIVE: ${{ steps.classify.outputs.substantive }}
        run: |
          if [[ "$SUBSTANTIVE" == "false" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  e2e-shards:
    name: End-to-end shard (${{ matrix.shard }}/3)
    needs: classify
    if: needs.classify.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose -f docker-compose.e2e.yml up --build --wait

      - name: Run shard
        working-directory: frontend
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: "1"

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --timestamps

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans

  hosted-address:
    name: End-to-end hosted addresses
    needs: classify
    if: needs.classify.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the hosted-address stack
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-hosted.yml up --build --wait

      - name: Run the hosted-address specs
        working-directory: frontend
        run: npx playwright test --config e2e/playwright.config.ts --grep @hosted
        env:
          CI: "1"

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-hosted.yml logs --no-color --timestamps

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-hosted-address
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-hosted.yml down --volumes --remove-orphans

  e2e:
    name: End-to-end (compose + Playwright)
    if: always()
    needs: [classify, e2e-shards, hosted-address]
    runs-on: ubuntu-latest
    steps:
      - name: Verify end-to-end result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SHOULD_RUN: ${{ needs.classify.outputs.run }}
          SHARDS_RESULT: ${{ needs.e2e-shards.result }}
          HOSTED_RESULT: ${{ needs.hosted-address.result }}
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Change classification failed."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "false" ]]; then
            echo "Diff touches only the ignorable set; the end-to-end check reports green."
            exit 0
          fi
          if [[ "$SHARDS_RESULT" != "success" || "$HOSTED_RESULT" != "success" ]]; then
            echo "One or more end-to-end lanes failed or were cancelled."
            exit 1
          fi
