name: End-to-end

# A browser driving the whole stack from docker-compose.e2e.yml: the
# production frontend bundle, the API, Postgres, the Firebase Auth emulator,
# the fake clearinghouse and the fake mail server. No cloud project, no
# vendor credentials.
# Design: docs/design/e2e-harness.md.
#
# Pull requests run the suite only for relevant paths. Main image workflows
# call this workflow directly, so no image is built or pushed unless the
# complete deterministic browser suite passes for that exact commit.
on:
  workflow_call:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/app/routes/**"
      - "backend/app/main.py"
      # The data layer, added after it broke the stack and this filter did not
      # notice. A change to how the database is built is about as likely to stop
      # a stack booting as anything in this repo, and on 2026-09-14 one did:
      # boot stopped building the platform schema, the backend refused to serve
      # without it, and no pull-request run of this suite ever saw the change —
      # ``backend/app/db/**``, ``backend/alembic/env.py`` and
      # ``backend/bin/migrate.py`` matched none of the lines above. It first ran
      # post-merge, in release.yml, where it blocked the image instead.
      - "backend/app/db/**"
      - "backend/alembic/**"
      - "backend/alembic_platform/**"
      - "backend/alembic.ini"
      - "backend/bin/**"
      - "backend/app/settings.py"
      - "backend/Dockerfile*"
      - "docker-compose*.yml"
      - ".env.e2e"
      - "scripts/fake_clearinghouse.py"
      - "scripts/fake_mail.py"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"
      # The models, added for the same reason ``backend/app/db/**`` was: this
      # job is a REQUIRED check, so a change it does not match is not merely
      # untested — it is unmergeable, because the check never reports and
      # branch protection waits for a run that will never start. Field
      # validation and model shape decide what the API accepts and what the
      # browser is handed, which is squarely what this suite exercises.
      # Found on 2026-09-21 by a change to ``models/validators.py`` that sat
      # green on every check that ran and blocked anyway.
      - "backend/app/models/**"

permissions:
  contents: read

# ``e2e-`` prefix: see the matching note in ci.yml. deploy.yml calls both of us
# from one run, where ``github.workflow`` and ``github.run_id`` are identical for
# each, so an unprefixed group makes the two siblings cancel each other.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose -f docker-compose.e2e.yml up --build --wait

      - name: Run the suite
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --timestamps

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
