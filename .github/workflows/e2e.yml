name: End-to-end

# A browser driving the whole stack from docker-compose.e2e.yml: the
# production frontend bundle, the API, Postgres, the Firebase Auth emulator,
# the fake clearinghouse and the fake mail server. No cloud project, no
# vendor credentials.
# Design: docs/design/e2e-harness.md.
#
# Pull requests run the suite only for relevant paths. Main image workflows
# call this workflow directly, so no image is built or pushed unless the
# complete deterministic browser suite passes for that exact commit.
on:
  workflow_call:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      # The whole backend application, not a list of its folders. This job is
      # a REQUIRED check, so a change it does not match is not merely untested
      # but unmergeable: the check never reports, and branch protection waits
      # for a run that will never start. A folder-by-folder list only ever
      # grew after that bit someone -- the data layer on 2026-09-14, the
      # models on 2026-09-21, and on 2026-09-23 a change confined to
      # backend/app/notes/ that sat green on every other check and could not
      # merge. services/, repositories/ and the rest were the same trap,
      # waiting. Everything under backend/app/ is imported by the server this
      # suite boots, so all of it is in scope.
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/alembic_platform/**"
      - "backend/alembic.ini"
      - "backend/bin/**"
      - "backend/Dockerfile*"
      # The dependencies the backend image installs. A version bump can stop
      # the stack booting as surely as a code change can.
      - "pyproject.toml"
      - "poetry.lock"
      - "docker-compose*.yml"
      - ".env.e2e"
      - "scripts/fake_clearinghouse.py"
      - "scripts/fake_mail.py"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

# ``e2e-`` prefix: see the matching note in ci.yml. deploy.yml calls both of us
# from one run, where ``github.workflow`` and ``github.run_id`` are identical for
# each, so an unprefixed group makes the two siblings cancel each other.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose -f docker-compose.e2e.yml up --build --wait

      - name: Run the suite
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --timestamps

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
