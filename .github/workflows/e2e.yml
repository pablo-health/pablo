name: End-to-end

# A browser driving the whole stack from docker-compose.e2e.yml: the
# production frontend bundle, the API, Postgres, the Firebase Auth emulator,
# the fake clearinghouse and the fake mail server. No cloud project, no
# vendor credentials.
# Design: docs/design/e2e-harness.md.
#
# Pull requests run the suite only for relevant paths. Main image workflows
# call this workflow directly, so no image is built or pushed unless the
# complete deterministic browser suite passes for that exact commit.
on:
  workflow_call:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    # NO paths: filter, deliberately. This job owns a REQUIRED check, and a
    # filtered workflow does not report a skipped result — it reports nothing
    # at all, so branch protection waits for a run that will never start. The
    # only ways out are an admin merge or an unrelated commit that happens to
    # match, and per ENGINEERING-STANDARD.md §3 the first of those is an
    # incident rather than a process.
    #
    # It had already happened twice by the time it was fixed here: a change to
    # backend/app/models/ (#1288) sat green on all nineteen checks that ran and
    # could not merge, and #1294 — a beads export, one line of .beads/ — sat
    # blocked for a day for the same reason with auto-merge armed and nothing
    # to arm against.
    #
    # Skipping WORK is a cost decision; skipping a required CHECK is a merge
    # policy. scripts/ci_classify_diff.sh separates the two, exactly as the
    # four jobs in ci.yml already use it. The directory list that used to live
    # here is gone rather than moved: the classifier's ignorable set is the
    # single place that decides, so there is no second list to drift.

permissions:
  contents: read

# ``e2e-`` prefix: see the matching note in ci.yml. deploy.yml calls both of us
# from one run, where ``github.workflow`` and ``github.run_id`` are identical for
# each, so an unprefixed group makes the two siblings cancel each other.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history back to the PR base for the classify step below.
          fetch-depth: 0

      - id: classify
        # Self-contained rather than a shared `needs:` job, matching ci.yml: a
        # skipped dependency skips its dependents, and the classification only
        # makes sense for a pull request. When this step does not run,
        # `substantive` is '' and every gate below fails open to the full
        # suite — so workflow_call (release, deploy), schedule and dispatch all
        # run everything, unchanged.
        if: github.event_name == 'pull_request'
        run: bash scripts/ci_classify_diff.sh "origin/${{ github.base_ref }}"

      - uses: actions/setup-node@v7
        if: steps.classify.outputs.substantive != 'false'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.classify.outputs.substantive != 'false'
        working-directory: frontend
        run: npm ci
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000

      - name: Install the Playwright browser
        if: steps.classify.outputs.substantive != 'false'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        if: steps.classify.outputs.substantive != 'false'
        run: docker compose -f docker-compose.e2e.yml up --build --wait

      - name: Run the suite
        if: steps.classify.outputs.substantive != 'false'
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Nothing to exercise
        if: steps.classify.outputs.substantive == 'false'
        run: echo "Diff touches only the ignorable set (see scripts/ci_classify_diff.sh) - the stack cannot be affected, so the suite is skipped and this check reports green."

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --timestamps

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
