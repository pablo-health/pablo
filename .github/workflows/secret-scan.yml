name: Secret scan

# Workflow-level secret scanning (gitleaks). Complements the pre-commit
# detect-private-key + gitleaks hooks for contributors who skip hooks.
# Runs the gitleaks binary directly (rather than the official Action, which
# requires a paid license for GitHub organizations).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --verbose
