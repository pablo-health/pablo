# Pre-commit hooks for Pablo.
#
# Install:  poetry run pre-commit install
# Run all:  poetry run pre-commit run --all-files
#
# Keep this file minimal: we want the hooks fast enough that developers
# leave them on. Heavier checks (pip-audit, pytest, trivy) live in CI.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies:
          - "pydantic>=2.0"
          - "fastapi>=0.100"
          - "sqlalchemy>=2.0"
        args: ["--config-file=pyproject.toml"]

  # No prettier hook. The tree is not prettier-formatted (the TypeScript omits
  # semicolons, and no prettier config reproduces its style), CI never runs it,
  # and ESLint in `make lint` owns frontend style. A prettier hook here rewrites
  # every file it touches.

  - repo: local
    hooks:
      - id: no-underscore-audit-params
        name: "Route handlers: forbid _audit / _http_request params"
        entry: python scripts/check_audit_params.py
        language: system
        files: ^backend/app/routes/.*\.py$
        pass_filenames: false

      - id: no-platform-in-tenant-chain
        name: "Tenant revisions: forbid platform. DDL (guardrail #4)"
        entry: python backend/scripts/check_tenant_chain_platform.py
        language: system
        files: ^backend/alembic/versions/.*\.py$
      - id: suppression-reasons
        name: "Type suppressions need a reason (guardrail #7)"
        entry: python scripts/check_suppression_reasons.py
        language: system
        files: ^(backend/(app|bin|scripts)/.*\.py|backend/entrypoint\.py|frontend/(src|app)/.*\.tsx?)$
        pass_filenames: false

      - id: migration-lint
        name: "Models ship with migrations (guardrail #4)"
        entry: python .claude/skills/migration-lint/check.py --staged
        language: system
        files: ^backend/(app/db/(models|platform_models)\.py|alembic/versions/.*\.py)$
        pass_filenames: false
