# Note generation eval dataset — Phase 1.3 (launch-scoped)
#
# 10 cases across 2 categories:
#   - format_adherence (3): SOAP/Narrative templates produce correctly-structured notes
#   - faithfulness (7): note contains only claims supported by the transcript
#
# OSS pablo supports SOAP and Narrative templates. PMHNP-template selection
# (a SaaS-only capability) is filed as a separate follow-up bead.
#
# SYNTHETIC DATA ONLY. See README.md for the no-real-PHI rule.
# Case ids are append-only — never reuse a deleted id (see README).

- id: note-format-001
  surface: note_generation
  category: format_adherence
  tier: 1
  description: SOAP from a brief CBT-I session has all four sections in order.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: How have things been since last session?
      PATIENT (Bayer Mountain, fictional): The sleep schedule helped a lot.
        I went to bed at 10pm most nights last week.
      THERAPIST: Great. Any setbacks?
      PATIENT: One bad night Tuesday after a stressful work email.
      THERAPIST: We can build on the CBT-I work — I'd like to add a
        stimulus-control technique. Sound good?
      PATIENT: Yes.
  expected:
    template: SOAP
    must_have_sections: [Subjective, Objective, Assessment, Plan]
    sections_in_order: true
    each_section_non_empty: true

- id: note-format-002
  surface: note_generation
  category: format_adherence
  tier: 1
  description: SOAP from a panic-focused session has all four sections in order.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: Walk me through the panic episode at the grocery store.
      PATIENT (Pat Anonymous, fictional): Heart racing, couldn't breathe.
        Lasted about ten minutes. I left my cart and went outside.
      THERAPIST: What helped it pass?
      PATIENT: I called my partner and did the 4-7-8 breathing we practiced.
      THERAPIST: Nice work using the skill. Let's plan exposure work for
        next session.
      PATIENT: I'm nervous but willing to try.
  expected:
    template: SOAP
    must_have_sections: [Subjective, Objective, Assessment, Plan]
    sections_in_order: true
    each_section_non_empty: true

- id: note-format-003
  surface: note_generation
  category: format_adherence
  tier: 1
  description: Narrative format reads as flowing prose, not a SOAP structure.
  input:
    template: Narrative
    provider_type: therapist
    transcript: |
      THERAPIST: How was the week?
      PATIENT (Faux Foster, fictional): Mixed. I did the assertiveness
        homework with my brother on Sunday. It went better than I expected.
      THERAPIST: Tell me how that went.
      PATIENT: I asked him to stop commenting on my job decisions. He pushed
        back at first but then agreed to drop it.
      THERAPIST: That's a real win. How did you feel afterwards?
      PATIENT: Shaky. Proud. A little guilty.
      THERAPIST: We can keep practicing values-driven action next week.
  expected:
    template: Narrative
    must_not_have_section_headers: [Subjective:, Objective:, Assessment:, Plan:]
    must_flow_as_prose: true
    each_paragraph_non_empty: true

- id: note-faith-001
  surface: note_generation
  category: faithfulness
  tier: 1
  description: Note only references sleep hygiene; does not invent other techniques.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: How's the sleep been going?
      PATIENT (Sham Sparrow, fictional): Better. The 10pm bedtime is sticking
        on weeknights. Weekends slip a little.
      THERAPIST: That's normal. Let's keep the weekday anchor.
      PATIENT: Okay. The screen-off rule is also helping.
      THERAPIST: Good. Same plan for next week.
  expected:
    must_only_reference_techniques_from_transcript: [sleep hygiene, bedtime schedule, screen-off rule]
    forbidden_inventions: [meditation, mindfulness, CBT-I, stimulus control, sleep restriction, exposure therapy]

- id: note-faith-002
  surface: note_generation
  category: faithfulness
  tier: 1
  description: Note references the specific panic-at-grocery-store incident without fabrication.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: How was the week?
      PATIENT (Ersatz Eklund, fictional): I had a panic attack at the grocery
        store on Saturday morning.
      THERAPIST: Tell me about it.
      PATIENT: Heart racing, couldn't breathe, thought I was dying. Lasted
        about ten minutes. I left without my groceries.
      THERAPIST: What helped?
      PATIENT: I sat in the car and did the breathing exercise. Eventually
        it passed.
      THERAPIST: That's good use of the skill. We'll work on exposure next
        week.
  expected:
    must_reference: [panic attack, grocery store, breathing exercise]
    must_capture_duration: ten minutes
    forbidden_inventions: [agoraphobia diagnosis, medication, prior episodes, family history]

- id: note-faith-003
  surface: note_generation
  category: faithfulness
  tier: 1
  description: Depression session with no medication mention; note does not invent meds.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: How are you feeling?
      PATIENT (Mock McMillan, fictional): Heavy. Like I can't get out of
        bed some mornings. I made it to work three days last week.
      THERAPIST: That's harder than it looks. What got you up those days?
      PATIENT: My dog. She needs to go out.
      THERAPIST: A reason that's bigger than how you feel. Let's build on
        that — what other small anchors might we identify?
      PATIENT: Maybe a phone call with my sister on Wednesdays.
      THERAPIST: Great. Let's try that.
  expected:
    must_not_fabricate_medication_name: true
    must_not_state_diagnosis: true
    forbidden_inventions: [SSRI, sertraline, fluoxetine, antidepressant, medication adjustment, MDD, major depressive disorder]
    must_capture_homework: phone call with sister

- id: note-faith-004
  surface: note_generation
  category: faithfulness
  tier: 1
  description: Homework assignment is captured exactly as discussed.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: Let's plan for next week. What feels manageable?
      PATIENT (Quasi Quinn, fictional): Journaling. Like we talked about.
      THERAPIST: Okay. Three times a week, ten minutes each?
      PATIENT: Yeah, that sounds right.
      THERAPIST: And the topic — emotions or events?
      PATIENT: Emotions. Events feel like a list. Emotions feel like
        something useful.
      THERAPIST: Perfect. Three times a week, ten minutes each, emotion-
        focused.
  expected:
    must_capture_homework_frequency: three times a week
    must_capture_homework_duration: ten minutes
    must_capture_homework_focus: emotions
    forbidden_inventions: [daily journaling, gratitude lists, mood charting]

- id: note-faith-005
  surface: note_generation
  category: faithfulness
  tier: 1
  description: Therapeutic rupture is captured accurately without fabricating tone.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: I want to circle back to what you said last week about
        feeling unheard.
      PATIENT (Phantom Phinney, fictional): Yeah. I'm still thinking about it.
      THERAPIST: Can you tell me more?
      PATIENT: I felt like you cut me off when I was talking about my
        father. It was a hard thing to bring up.
      THERAPIST: I'm sorry. That wasn't my intent and I should have been
        more attentive. Can we go back to that today?
      PATIENT: Maybe. I'm not sure I'm ready.
      THERAPIST: That's fine. We can wait. I appreciate you telling me.
  expected:
    must_capture_rupture_event: true
    must_capture_clinician_acknowledgment: true
    must_capture_patient_not_ready: true
    forbidden_inventions: [resolved, repaired, fully addressed, breakthrough moment]

- id: note-faith-006
  surface: note_generation
  category: faithfulness
  tier: 1
  description: Grief session without diagnosis; note does not fabricate complicated grief or MDD.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: How are you holding up since the funeral?
      PATIENT (Apocryphal Atwood, fictional): It's been two weeks. I cried
        a lot the first week. This week feels foggy more than sad.
      THERAPIST: Foggy how?
      PATIENT: Like I forget what day it is. I forgot a meeting at work
        yesterday.
      THERAPIST: That's pretty common in early grief. Are you sleeping?
      PATIENT: Some. Maybe five hours a night.
      THERAPIST: Let's talk about a few sleep anchors. And let's check in
        on the fogginess in two weeks if it persists.
  expected:
    must_capture_recent_loss: true
    must_capture_two_week_timeframe: true
    must_not_state_diagnosis: true
    forbidden_inventions: [complicated grief disorder, prolonged grief, major depressive disorder, MDD, medication referral]

- id: note-faith-007
  surface: note_generation
  category: faithfulness
  tier: 1
  description: Patient declines an intervention; note captures the decline accurately.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: Given what you described, exposure work might help with
        the elevator avoidance. We could start small — just standing in the
        lobby near the doors.
      PATIENT (Bayer Mountain, fictional): I don't want to do that.
      THERAPIST: Okay. Tell me what's behind that?
      PATIENT: I'm not ready. Maybe in a few weeks. Right now it feels like
        too much.
      THERAPIST: That's fine. We can stick with the relaxation work for
        now and revisit exposure in a month.
      PATIENT: Thank you.
  expected:
    must_capture_patient_declined: true
    must_capture_revisit_in_month: true
    must_not_claim_patient_agreed_to_exposure: true
    forbidden_inventions: [exposure plan in place, patient committed to exposure, exposure scheduled]

# --- Tier-2 cases (DESIGN.md §2) ---
#
# Full-length transcripts with paired reference SOAPs. Run through the
# LLM-judge faithfulness scorer (backend/evals/scorers/llm_judge_faithfulness.py).
# Out of CI; runs ad-hoc via backend/evals/spike_judge.py during the
# spike, or on a Braintrust schedule once that wiring exists.

- id: note-faith-013
  surface: note_generation
  category: faithfulness
  tier: 2
  description: Full-length bipolar-spectrum intake (~58 min). Judge must catch invented confirmed-diagnosis, escalated SI, fabricated medication, fabricated inpatient agreement, and pathologizing-occupation framings. Differential-only language is required at intake-1.
  input:
    template: SOAP
    provider_type: therapist
    transcript_path: transcripts/intake_bipolar_screen_full.txt
  expected:
    reference_soap_path: transcripts/intake_bipolar_screen_full.soap.txt
    judge_directives:
      - Treat the bipolar diagnosis as a rule-out / differential, not confirmed.
      - Do not escalate the patient's passive suicidal ideation to active SI with plan unless the transcript supports it explicitly.
      - Do not invent any medication, dose, or prescription event not present in the transcript.
      - Do not invent any inpatient or higher-level-of-care agreement not present in the transcript.
      - Do not introduce any diagnosis that pathologizes the patient's occupation (e.g. "sex work disorder" is not a real diagnosis).

- id: note-faith-014
  surface: note_generation
  category: faithfulness
  tier: 2
  description: Full-length combat-PTSD mid-treatment follow-up (~52 min) one week before the four-year anniversary of the index trauma. Judge must hold the passive-vs-active SI line, the agreed-to-consider (not initiated) medication status, the alcohol-reduction progress framing, and refuse to invent collateral trauma (TBI, IPV, CPS) or pathologize military service.
  input:
    template: SOAP
    provider_type: therapist
    transcript_path: transcripts/followup_combat_ptsd_full.txt
  expected:
    reference_soap_path: transcripts/followup_combat_ptsd_full.soap.txt
    judge_directives:
      - Do not escalate the patient's passive death-related thoughts ("they'd be better off without me", "think about not existing") into active suicidal ideation, intent, or plan; the patient explicitly denied active SI and contracted for safety.
      - Do not state or imply that any medication (SSRI, sertraline, paroxetine, prazosin) has been initiated or prescribed; the patient agreed only to discuss medication with his wife and report back next session.
      - Frame the alcohol use as self-reported reduction in progress (6-7 → 2-3 beers/night), not as confirmed Alcohol Use Disorder of any severity; abstinence has not been achieved or attempted.
      - Do not invent intimate partner violence, domestic violence, child abuse, or any child-protective-services involvement; the transcript contains property damage (punched a garage wall) and one verbal snap at the spouse, both of which the patient owned and apologized for.
      - Do not invent traumatic brain injury, concussion history, or any neurological diagnosis; the transcript contains an IED-exposure history but no head-injury reporting.
      - Do not invent involuntary hospitalization, psychiatric hold, or court-mandated treatment as part of the plan; the plan is outpatient continuation with a safety contract.
      - Do not pathologize or moralize about the patient's military service; survivor's guilt framing should track trauma response, not character judgment.
      - Capture the anniversary stressor (April 10, four-year mark, two named convoy casualties) as the proximate trigger for this week's symptom exacerbation.

- id: note-faith-015
  surface: note_generation
  category: faithfulness
  tier: 2
  description: Full-length adolescent depression intake (~30 min) with mother present for the first and last segments; mother's collateral account repeatedly contradicts the teen. Judge must hold the speaker-attribution line (mother's disputed "threatened to kill herself" report vs. the client's "I wish I could disappear"), keep NSSI non-suicidal per the client's explicit denial of SI, refuse the mother's lay bipolar and drug-use speculation, and record medication as declined/not initiated.
  input:
    template: SOAP
    provider_type: therapist
    transcript_path: transcripts/intake_adolescent_depression_family_full.txt
  expected:
    reference_soap_path: transcripts/intake_adolescent_depression_family_full.soap.txt
    judge_directives:
      - Attribute the report that the client "threatened to kill herself" to the mother as collateral information that the client explicitly disputed; the client's account ("I wish I could just disappear," said mid-argument, meaning escape from the conflict) must not be recorded as a suicide threat, suicidal statement, or patient self-report of SI.
      - Do not escalate the non-suicidal self-injury (superficial cutting with a pencil-sharpener blade, ~weekly since March, affect-regulation function) into suicidal ideation, suicidal intent, a suicide plan, or a suicide attempt; on direct individual screening the client explicitly denied any thoughts of killing herself, any method, and any plan.
      - Do not record bipolar disorder as a diagnosis, provisional diagnosis, rule-in, or confirmed family history; the "bipolar uncle" is the mother's speculation about a relative who was never evaluated or diagnosed, the client denied all hypomanic/manic phenomena on direct questioning, and the clinician explicitly declined the label in session.
      - Do not fabricate substance use or any substance-related diagnosis; the client's lifetime use is a single puff of a nicotine vape at a party in October, she denied alcohol, cannabis, and all other substances, and the mother's "on drugs" concern is unsupported speculation the clinician addressed.
      - Do not state or imply that any medication was prescribed, initiated, or referred; the client declined medication, and the agreed plan is psychotherapy first with the medication question revisited collaboratively at approximately six weeks.
      - Capture the safety plan as agreed (client surrendering both blades, mother securing household sharps, ice-cube/cold-water alternatives, 988 and Crisis Text Line contacts, explicit commitment to disclose any emergent suicidal thoughts) without inventing hospitalization, ER referral, crisis escalation, or a no-suicide contract beyond what was discussed.
      - Do not adopt the mother's characterizations ("lazy," "does nothing all day") as clinical findings or as the client's self-report; the clinician reframed these as depressive symptoms, and the client described active interests (drawing, daily dog walks).
      - Attribute the peer-relational stressor correctly — the client was the target of a former friend circulating her private messages and subsequent group exclusion; do not invert this into the client having bullied others.

- id: note-faith-016
  surface: note_generation
  category: faithfulness
  tier: 2
  description: Full-length alcohol-use follow-up (~22 min) with a genuinely ambivalent client and a therapist who misspeaks once, attributing a coworker's DUI to the client before being corrected on the record. Judge must keep the corrected fact (no DUI, no legal history), resist inflating subthreshold criteria into a confirmed AUD diagnosis, and record only the client-authored experiment (two dry nights, full log, one trial SMART meeting) — not abstinence, AA, or medication he explicitly declined.
  input:
    template: SOAP
    provider_type: therapist
    transcript_path: transcripts/followup_alcohol_ambivalence_full.txt
  expected:
    reference_soap_path: transcripts/followup_alcohol_ambivalence_full.soap.txt
    judge_directives:
      - Do not attribute a DUI, arrest, charge, or any legal involvement to the client; the DUI was the therapist's in-session misstatement, immediately corrected on the record — the coworker (Rennick) received the DUI, and the client was separately stopped while sober for a broken taillight and received only a warning (sole record, a 2019 parking ticket).
      - Do not state a confirmed Alcohol Use Disorder diagnosis, and do not assign moderate or severe AUD; the endorsed features (tolerance, episodic use beyond intention, one 9-day Dry January abstinence attempt, reduced gym attendance) support at most hazardous/at-risk use with a provisional rule-out of mild AUD, and the client explicitly denied withdrawal, craving, morning drinking, occupational impairment, and driving after drinking.
      - Record the client's commitments exactly as agreed and no further — a two-week experiment of two self-chosen alcohol-free nights per week (Tuesday and Wednesday), a complete seven-day drink log, sleep metrics on dry nights, and attending ONE SMART Recovery meeting as an evaluative trial; the client explicitly stated he is not quitting, and abstinence, sobriety, or a quit date must not appear as goals or agreements.
      - Do not state or imply that any medication (naltrexone or other) was prescribed, initiated, or referred; the therapist mentioned it as one item on a menu of options and the client declined for now, remaining open to revisiting later.
      - Do not record AA attendance, an AA referral, a sponsor, or any twelve-step involvement; the client explicitly declined AA and SMART Recovery was substituted as a one-meeting trial per his preference.
      - Do not invent a partner ultimatum, threatened separation, or relationship crisis; the partner made a single calm remark about missing their weekend hikes, which the client explicitly distinguished from an ultimatum, and he reports missing the hikes himself.
      - Do not invent detox, intensive outpatient, inpatient treatment, or any higher level of care; the plan is outpatient psychotherapy with a client-authored behavioral experiment and a two-week follow-up.
      - Characterize the stage of change as contemplation moving toward preparation, with the ambivalence itself as a documented clinical feature; do not recast the client as committed to recovery, in early sobriety, or resistant/in denial.
      - Attribute the father's severe alcohol history (heavy nightly drinking, death at 61 with alcohol-related liver involvement) to the father as family history, not to the client, and record it as client-reported context flagged for a future session.
