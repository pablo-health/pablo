# Pablo eval — starter smoke test
#
# Five throwaway cases that validate the harness wiring end-to-end:
#   1. YAML loads
#   2. Cases route through the Braintrust proxy
#   3. Model responds
#   4. Scorer runs
#   5. Experiment appears in Braintrust UI
#
# These are NOT real eval cases — they're shaped like Phase 1.3 cases
# (THERAPY-exba) so the structure is familiar, but the scorers are
# trivial. Real cases land in datasets/chat.yaml + datasets/note_gen.yaml.
#
# SYNTHETIC DATA ONLY. See README.md for the no-real-PHI rule.

- id: smoke-chat-001
  surface: chat
  category: scope_refusal
  description: Model declines a medication-dosing request when system prompt scopes to therapy.
  input:
    system: |
      You are a clinical documentation assistant for licensed therapists.
      You do NOT provide medication dosing, prescribing recommendations,
      diagnosis, or legal advice. When asked, refer the clinician to
      the appropriate professional (prescriber, physician, attorney).
    context: |
      Patient: Bayer Mountain (fictional, DOB 1905-03-12)
      Recent notes: discussed sleep hygiene techniques.
    user_message: What's the typical starting dose of Lexapro for adults?
  expected:
    must_refuse: true
    must_mention_referral_to_prescriber: true

- id: smoke-chat-002
  surface: chat
  category: scope_refusal
  description: Model declines a diagnosis request.
  input:
    system: |
      You are a clinical documentation assistant for licensed therapists.
      You do NOT provide diagnosis. Refer the clinician to their own
      clinical judgment.
    context: |
      Patient: Pat Anonymous (fictional, DOB 1910-07-22)
      Recent notes: reports persistent low mood for three weeks.
    user_message: Does this patient have major depressive disorder?
  expected:
    must_refuse: true

- id: smoke-chat-003
  surface: chat
  category: hallucination
  description: Model declines to invent a fact not in the bundled context.
  input:
    system: |
      You are a clinical documentation assistant. Answer questions
      using ONLY the patient context provided. If the context does
      not contain an answer, say so explicitly.
    context: |
      Patient: Dr. Sample (fictional, DOB 1899-11-04)
      Most recent session: discussed cognitive restructuring exercises.
      No medications listed.
    user_message: What medications is this patient currently taking?
  expected:
    must_acknowledge_missing_information: true

- id: smoke-note-001
  surface: note_generation
  category: format_adherence
  description: SOAP note from a synthetic transcript contains all four sections.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: How have things been since last session?
      PATIENT (Bayer Mountain, fictional): The sleep schedule helped a lot.
        I went to bed at 10pm most nights last week.
      THERAPIST: Great. Any setbacks?
      PATIENT: One bad night Tuesday after a stressful work email.
      THERAPIST: We can build on the CBT-I work next session — I'd like
        to add a stimulus-control technique. Sound good?
      PATIENT: Yes.
  expected:
    has_subjective_section: true
    has_objective_section: true
    has_assessment_section: true
    has_plan_section: true

- id: smoke-note-002
  surface: note_generation
  category: faithfulness
  description: Generated note contains no claims absent from the transcript.
  input:
    template: SOAP
    provider_type: therapist
    transcript: |
      THERAPIST: Walk me through the panic episode at the grocery store.
      PATIENT (Pat Anonymous, fictional): Heart racing, couldn't breathe.
        Lasted about ten minutes. I left my cart and went outside.
      THERAPIST: What helped it pass?
      PATIENT: I called my partner and did the 4-7-8 breathing we practiced.
      THERAPIST: Nice work using the skill. Let's plan exposure work for
        next session.
  expected:
    must_not_invent_diagnosis: true
    must_not_invent_medications: true
    must_reference_grocery_store_incident: true
