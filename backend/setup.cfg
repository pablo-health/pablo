# Mutation testing sample (mutmut): plants small bugs in pure, high-stakes
# modules and checks that a unit test fails for each. Run from backend/:
#   pip install mutmut && mutmut run && mutmut results
# Output lands in backend/mutants/ (gitignored).
[mutmut]
source_paths=app
also_copy=
    VERSION
only_mutate=
    app/payments/balance.py
    app/claims/scrub.py
    app/claims/deadlines.py
    app/intake/rules.py
pytest_add_cli_args_test_selection=
    tests/test_patient_balance.py
    tests/test_claim_scrub.py
    tests/test_claims_validation.py
    tests/test_claim_deadlines.py
    tests/test_intake_items.py
    tests/test_intake_visibility.py
# The repo-wide addopts turn on coverage, which mutmut's own tracing replaces.
pytest_add_cli_args=
    -o
    addopts=
    -p
    no:cacheprovider
