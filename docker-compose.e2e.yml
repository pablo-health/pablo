# The end-to-end stack: the whole product on one machine with no cloud
# project and no vendor credentials. Design: docs/design/e2e-harness.md.
#
#   make e2e-up     build the images, start everything, wait for health
#   make e2e        run the Playwright suite in frontend/e2e/
#   make e2e-down   stop the stack and drop its database volume
#
# The backend and database mirror docker-compose.yml but are declared here
# in full: the dev file mounts local cloud credentials and publishes the dev
# ports, and this stack must do neither. It has its own project name, so it
# never touches the dev stack's containers or data.
#
# Host ports default to the ones the browser-facing design fixes (frontend
# 3000, backend 8000, auth emulator 9099). Override E2E_FRONTEND_PORT,
# E2E_BACKEND_PORT, E2E_CLEARINGHOUSE_PORT, E2E_MAIL_PORT or E2E_SMS_PORT when
# something already listens there. The emulator port is baked into the
# frontend bundle at build time, so changing E2E_AUTH_EMULATOR_PORT needs
# `make e2e-up` to rebuild.
name: pablo-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pablo
      POSTGRES_PASSWORD: pablo_dev
      POSTGRES_DB: pablo
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pablo"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - e2e-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    ports:
      - "${E2E_BACKEND_PORT:-8000}:8000"
      # The frontend shares this network namespace (see its network_mode),
      # so its port is published on this service.
      - "${E2E_FRONTEND_PORT:-3000}:3000"
      # And so does the object store, for the reason its env block gives.
      - "9000:9000"
    environment:
      - DEBUG=true
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:${E2E_FRONTEND_PORT:-3000}
      - CORS_ALLOW_CREDENTIALS=true
      - DATABASE_BACKEND=postgres
      - DATABASE_URL=postgresql://pablo:pablo_dev@postgres:5432/pablo
      - GCP_PROJECT_ID=demo-pablo-e2e
      - FIREBASE_PROJECT_ID=demo-pablo-e2e
      # Tokens are verified against the emulator; no credentials needed.
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-auth:9099
      - REQUIRE_BAA=false
      # The audit trail's second copy goes to Cloud Logging; with no cloud
      # credentials every write would first wait on the credential lookup.
      - AUDIT_DUAL_WRITE_ENABLED=false
      # The e2e user never enrolls a second factor. Only honoured together
      # with ENVIRONMENT=development (see Settings).
      - REQUIRE_MFA=false
      - AI_MODEL=google:gemini-3.1-pro-preview
      - GOOGLE_REGION=global
      - PRACTICE_ENABLED=true
      - PRACTICE_DAILY_SESSION_LIMIT=999
      - PUBLIC_BOOKING_ENABLED=true
      # A booking link is born requiring the booker to confirm by email, and
      # the booking is refused outright when nothing can deliver that mail —
      # so the stack needs a mail server, not a silent drain.
      - EMAIL_BACKEND=smtp
      - SMTP_HOST=fake-mail
      - SMTP_PORT=1025
      - SMTP_USERNAME=e2e
      - SMTP_PASSWORD=e2e
      - SMTP_FROM=bookings@example.test
      # The sender negotiates STARTTLS against the default certificate store.
      # The fake mints its own certificate at startup and shares it on the
      # volume below; nothing else in this stack speaks TLS, so trusting that
      # one certificate and nothing else costs nothing.
      # Scoped to the mail client. SSL_CERT_FILE, which this used to be,
      # REPLACES the process-wide trust store — so trusting the fake mail
      # server meant failing certificate verification for every other
      # outbound call, the NPI registry included.
      - SMTP_CA_FILE=/srv/mail-tls/cert.pem
      # The links the product mails point back at the browser's own origin.
      - APP_URL=http://localhost:${E2E_FRONTEND_PORT:-3000}
      # Confirming a claim only marks it ready; the pipeline inside the API
      # process is what actually sends it, and at the five-minute default no
      # end-to-end test could ever watch a claim leave. One minute is the
      # floor the setting allows.
      - CLAIMS_PIPELINE_INTERVAL_MINUTES=1
      # Point claim submission and eligibility at the fake clearinghouse.
      # The key only has to be present; the fake never checks it.
      - CLEARINGHOUSE_API_KEY=test_e2e_not_a_real_key
      - CLEARINGHOUSE_BASE_URL=http://fake-clearinghouse:8080
      # Never the real CMS registry: it is somebody else's uptime, and its
      # records are real people's, which is not what a fixture should be.
      - NPPES_BASE_URL=http://fake-nppes:8081/
      - CLEARINGHOUSE_WEBHOOK_SECRET=e2e-clearinghouse-webhook-shared-secret
      # The practice's tax id is stored encrypted under this key, and filing a
      # claim needs a billing profile, so without it saving one is a 500. The
      # value is a placeholder that happens to be 32 valid base64 bytes, so it
      # reads as the fixture it is; it only ever encrypts this stack's
      # throwaway database.
      - GOOGLE_CALENDAR_ENCRYPTION_KEY=e2eplaceholderkeyplaceholderkeyplaceholderA=
      # A client's charge ledger is 503 until the deployment has card
      # payments configured, and what a payer says a client owes lands on
      # that ledger — so without a key no end-to-end test can see the one
      # number the billing surface exists to produce. Present, not valid:
      # reading the ledger never calls the processor, and nothing in this
      # stack charges a card. Same rule as the clearinghouse key above.
      - STRIPE_SECRET_KEY=sk_test_e2e_not_a_real_key
      # The patient portal's front door. Both factors have to be readable by
      # a spec or no test can walk a sign-in: the magic link arrives at the
      # mail server above, and the step-up code goes to the fake gateway
      # below. Both gateways that make the code readable are refused outside
      # a development environment, which this stack is.
      - ENABLE_PATIENT_PORTAL=true
      - PORTAL_TOKEN_SIGNING_KEY=e2e-portal-signing-key-not-a-real-secret
      - PORTAL_WEB_BASE_URL=http://localhost:${E2E_FRONTEND_PORT:-3000}
      - PORTAL_INVITE_DELIVERY=smtp
      - PORTAL_SMS_GATEWAY=capture
      - PORTAL_SMS_CAPTURE_URL=http://fake-sms:8026
      # Somewhere for a file to go. A document upload is browser→storage
      # direct against a signed URL, so no fake can stand in for it at the
      # API: the browser has to reach a real object store and the store has
      # to check a real signature. MinIO speaks S3, which this codebase
      # already has a provider for (see file_storage.py), and boto3 is in
      # the dev dependency group this image installs.
      #
      # The URL is signed for the host the browser will use, and the
      # backend shares its network namespace, so ONE address serves both —
      # which is why the port is fixed rather than overridable: a published
      # port that disagreed with the signed one would fail the signature,
      # not the connection, and read as "storage rejected the upload".
      - FILE_STORAGE_PROVIDER=s3
      - AWS_S3_ENDPOINT_URL=http://localhost:9000
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=e2e-not-a-real-key
      - AWS_SECRET_ACCESS_KEY=e2e-not-a-real-secret
      - PATIENT_DOCUMENTS_GCS_BUCKET=pablo-e2e-documents
    healthcheck:
      # curl isn't in the Chainguard base; probe with the stdlib. The image's
      # own check targets a path the app doesn't serve, so it is replaced.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').getcode() == 200 else 1)",
        ]
      interval: 3s
      timeout: 5s
      start_period: 20s
      retries: 30
    volumes:
      - e2e-mail-tls:/srv/mail-tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Nothing builds a schema at boot any more, so the backend cannot start
      # until the migrate job has finished. A non-zero exit there fails the stack,
      # which is right: a backend that cannot see its schema refuses to serve, and
      # would only fail a moment later and less clearly.
      migrate:
        condition: service_completed_successfully
      firebase-auth:
        condition: service_healthy
      fake-clearinghouse:
        condition: service_healthy
      fake-nppes:
        condition: service_healthy
      fake-mail:
        condition: service_healthy
      fake-sms:
        condition: service_healthy
    networks:
      - e2e-net

  # Object storage, in the backend's network namespace so that one address
  # — localhost:9000 — is the store from inside the stack AND from the
  # browser on the host. A presigned URL signs the host it was made for, so
  # two addresses would mean a signature that never verifies.
  #
  # It cannot depend on the backend being HEALTHY (sharing a namespace
  # already makes it start second, and the backend does not need a bucket
  # to serve), so nothing here gates boot. What gates the suite is
  # create-bucket, which the frontend waits on.
  storage:
    # quay.io, not Docker Hub: MinIO's Hub repository no longer serves
    # pulls, so ``minio/minio:<tag>`` fails with a denied-access error that
    # reads like a missing tag.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--address", ":9000"]
    network_mode: "service:backend"
    environment:
      - MINIO_ROOT_USER=e2e-not-a-real-key
      - MINIO_ROOT_PASSWORD=e2e-not-a-real-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 20
    depends_on:
      backend:
        condition: service_started

  # The bucket the document routes are configured with. One shot: MinIO has
  # no "create on first write", and an upload against a missing bucket is a
  # 500 from the signing call rather than anything a spec could read.
  create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    network_mode: "service:backend"
    entrypoint:
      [
        "sh",
        "-c",
        "mc alias set e2e http://localhost:9000 e2e-not-a-real-key e2e-not-a-real-secret && mc mb --ignore-existing e2e/pablo-e2e-documents",
      ]
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy

  # A SECOND practice, so cross-tenant isolation can be tested through the app
  # rather than only at the integration layer. Runs once, after the backend is
  # healthy -- which is the signal that migrations have run and the platform
  # tables exist -- then exits.
  #
  # `--wait` treats a service that exits 0 as satisfied, so `make e2e-up`
  # returns only once this has finished. The isolation specs therefore cannot
  # start before the practice they need exists.
  # Schemas, before anything tries to serve from them.
  #
  # This stack used to need no migrate step: ``ensure_schemas`` built the
  # platform schema at boot with ``PlatformBase.metadata.create_all``, and the
  # backend container bootstrapped its own database on the way up. That is gone —
  # ``create_all`` emits tables, columns and indexes and nothing else, so a schema
  # built that way silently lacked every policy, trigger and CHECK that is not
  # expressible as a model. Boot now checks and refuses, which is what the stack
  # hit: `PlatformSchemaMissingError ... 0 platform table(s) present`, backend
  # unhealthy, every dependent service stuck behind it.
  #
  # So the stack does what a deployment does — runs the migrate job first. One
  # entrypoint, both chains, in the order the tenant chain's foreign keys require.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    # Two entrypoints, in this order, because they do different halves of the
    # job. ``migrate.py`` brings the platform schema and the ``practice``
    # TEMPLATE to head; it does not touch the per-practice schemas at all, and
    # ``migrate_tenants.py`` is what fans the tenant chain out across those.
    # A deployment runs both as separate jobs; a stack that ran only the first
    # would be correct on a fresh volume — where every practice is provisioned
    # from the freshly-regenerated template — and would silently leave an
    # EXISTING practice a revision behind on a reused one. That reads as
    # ``relation "..." does not exist`` from whatever spec touches the new
    # table first, which is a long way from the cause.
    command:
      [
        "sh",
        "-c",
        "python backend/bin/migrate.py && python backend/bin/migrate_tenants.py",
      ]
    environment:
      - DATABASE_BACKEND=postgres
      - DATABASE_URL=postgresql://pablo:pablo_dev@postgres:5432/pablo
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e2e-net

  seed-second-practice:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: ["python", "backend/scripts/e2e_seed_second_practice.py"]
    environment:
      - DATABASE_URL=postgresql://pablo:pablo_dev@postgres:5432/pablo
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - e2e-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: localhost:${E2E_AUTH_EMULATOR_PORT:-9099}
    # One API_URL serves both the browser and the server-rendered pages, so
    # the frontend runs inside the backend's network namespace: from either
    # side, localhost:<backend port> is the backend. Service names on the
    # stack's network (firebase-auth) still resolve from here.
    network_mode: "service:backend"
    env_file: .env.e2e
    environment:
      # Two addresses for one backend, because there are two callers. Inside
      # the shared namespace the backend is on its CONTAINER port, always
      # 8000 whatever the stack publishes; the browser can only reach the
      # PUBLISHED port. They are the same string until E2E_BACKEND_PORT is
      # overridden, at which point server-rendered fetches were dialling a
      # port nothing listens on inside the namespace — every browser-driven
      # spec failing on a blank page while the API-only ones passed.
      - API_URL=http://localhost:8000
      - PUBLIC_API_URL=http://localhost:${E2E_BACKEND_PORT:-8000}
      # The booking pages are reached with no session: the link is the
      # credential. A deployment that publishes them says so here, and the
      # auth middleware unions this into its own allowlist.
      - EXTRA_PUBLIC_PATHS=/book
    healthcheck:
      # Distroless runtime: no shell, node at a fixed path.
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://localhost:3000/api/config').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      start_period: 10s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy
      # Two things at once, and the second is the load-bearing one.
      #
      # Ordering: the suite signs in and immediately expects a second practice
      # to exist, so the frontend has no business accepting traffic before the
      # seeding that creates it has finished.
      #
      # And ``up --wait`` returns when every service is *running or healthy*. A
      # container that has exited is neither, so a one-shot service failed the
      # step no matter what it exited with — the log read "seed-second-practice
      # exited (0)" and then "exit code 1", and every branch was red on this
      # job from the day the seeder landed. Naming it here as
      # ``service_completed_successfully`` is what tells compose the exit was
      # the point. A non-zero exit still fails the stack, which is correct: a
      # suite that needs the second practice should not run without it.
      seed-second-practice:
        condition: service_completed_successfully
      # Same reasoning as the line above: ``up --wait`` returns when every
      # service is running or healthy, and a one-shot that has exited is
      # neither — so naming it here is what makes the bucket's creation
      # part of "the stack is ready" rather than a race a document spec
      # loses occasionally.
      create-bucket:
        condition: service_completed_successfully

  firebase-auth:
    build:
      context: ./scripts/e2e
      dockerfile: firebase-auth.Dockerfile
    ports:
      - "${E2E_AUTH_EMULATOR_PORT:-9099}:9099"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9099/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      start_period: 10s
      retries: 30
    networks:
      - e2e-net

  fake-nppes:
    build:
      context: .
      dockerfile: scripts/e2e/fake-nppes.Dockerfile
    ports:
      - "${E2E_NPPES_PORT:-8081}:8081"
    environment:
      - FAKE_NPPES_FIXTURES=/srv/fixtures
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/_fake/health').getcode() == 200 else 1)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - e2e-net

  fake-clearinghouse:
    build:
      context: .
      dockerfile: scripts/e2e/fake-clearinghouse.Dockerfile
    ports:
      - "${E2E_CLEARINGHOUSE_PORT:-8080}:8080"
    environment:
      - FAKE_CLEARINGHOUSE_FIXTURES=/srv/fixtures
      - FAKE_CLEARINGHOUSE_PUBLIC_URL=http://fake-clearinghouse:8080
      # A download link is followed by the practice's browser, which is on
      # the host, not on this network.
      - FAKE_CLEARINGHOUSE_BROWSER_URL=http://localhost:${E2E_CLEARINGHOUSE_PORT:-8080}
      - FAKE_CLEARINGHOUSE_WEBHOOK_URL=http://backend:8000/api/webhooks/clearinghouse
      - FAKE_CLEARINGHOUSE_WEBHOOK_SECRET=e2e-clearinghouse-webhook-shared-secret
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/_fake/received').getcode() == 200 else 1)",
        ]
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 20
    networks:
      - e2e-net

  fake-mail:
    build:
      context: .
      dockerfile: scripts/e2e/fake-mail.Dockerfile
    ports:
      - "${E2E_MAIL_PORT:-8025}:8025"
    environment:
      # Must match the host the backend connects to: the certificate is
      # issued for this name and the sender verifies it.
      - FAKE_MAIL_HOSTNAME=fake-mail
      - FAKE_MAIL_TLS_DIR=/srv/tls
    volumes:
      - e2e-mail-tls:/srv/tls
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8025/_fake/messages').getcode() == 200 else 1)",
        ]
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 20
    networks:
      - e2e-net

  # Where the portal's step-up codes go instead of a phone. The backend's
  # capture gateway posts each one here and a spec reads it back; see
  # scripts/fake_sms.py and frontend/e2e/fixtures/sms.ts.
  fake-sms:
    build:
      context: .
      dockerfile: scripts/e2e/fake-sms.Dockerfile
    ports:
      - "${E2E_SMS_PORT:-8026}:8026"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8026/_fake/messages').getcode() == 200 else 1)",
        ]
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 20
    networks:
      - e2e-net

networks:
  e2e-net:
    driver: bridge

volumes:
  e2e-postgres-data:
  # The mail server's start-of-run certificate, shared with the backend so it
  # can trust the STARTTLS handshake.
  e2e-mail-tls:
