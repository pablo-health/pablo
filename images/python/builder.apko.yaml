# Builder base for backend/Dockerfile.production, built with apko from
# public Wolfi packages. Same interpreter stream as runtime.apko.yaml,
# plus a shell, pip and a C toolchain so that dependencies without a
# prebuilt wheel can still compile. The build stage is discarded; only the
# installed packages are copied into the runtime image.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - busybox
    - bash
    - build-base
    - python-3.14
    - python-3.14-dev
    - py3.14-pip
    - py3.14-setuptools

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: "65532"

entrypoint:
  command: /usr/bin/python

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

archs:
  - x86_64
