[project]
name = "pablo"
version = "0.9.0"
description = "Therapy session management platform with AI-powered SOAP note generation"
authors = [{name = "Kurt Niemi", email = "kurt@pablo.health"}]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "backend"}]

[tool.poetry.dependencies]

# Web Framework
fastapi = ">=0.136.3"
uvicorn = {extras = ["standard"], version = "^0.48.0"}
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"

# Environment Variables
python-dotenv = "^1.2.2"

# Google Cloud (for GCP deployment)
google-cloud-secret-manager = "^2.28.0"

# Firebase Admin SDK (for verifying Firebase ID tokens)
firebase-admin = "^6.9.0"
pyjwt = {extras = ["crypto"], version = ">=2.13.0"}

# PostgreSQL (schema-per-practice multi-tenancy)
sqlalchemy = "^2.0.50"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.12"

# Caching
redis = "^5.0.0"

# PDF Generation
reportlab = "^4.5.1"

# PDF text extraction (patient document upload, THERAPY-ak6m.2).
# Native-text PDFs pass through fitz.open(stream=...) → page.get_text().
# Scanned PDFs return <100 chars and get OCR'd by a follow-up bead
# (ak6m.2.3) — fitz is sufficient for v1.
pymupdf = "^1.24.0"

# NLI Verification — onnxruntime only; sentence-transformers (+ torch)
# moved to optional nli group since verification is gated by
# ENABLE_EMBEDDING_VERIFICATION env var.
onnxruntime = ">=1.26.0"

# iCal calendar feed parsing
icalendar = "^7.1.2"

# Real-time audio (Practice Mode)
httpx = ">=0.28.0"

# Security: pin transitive dep floor (CVE fixes in 3.13.4)
aiohttp = ">=3.13.4"

email-validator = "^2.3.0"
python-multipart = ">=0.0.29"
google-cloud-storage = "^3.10.1"
google-cloud-tasks = "^2.22.0"
google-cloud-batch = "^0.21.0"
# Document AI OCR fallback for scanned patient PDFs (THERAPY-ak6m.2.3).
# Imported lazily inside services/document_ai_ocr.py so containers that
# leave document_ai_processor_id unset never load the client.
google-cloud-documentai = "^3.0.0"
# Audit log dual-write to Cloud Logging for tamper-evident HIPAA retention.
# See backend/app/services/audit_cloud_logging.py.
google-cloud-logging = "^3.11.0"

# Vertex Gemini SDK — used by ChatLLMGateway, StructuredLLMGateway,
# EhrNavigationService, and EmbeddingService. Imported lazily inside
# each module's _get_client(), so a missing dep won't fail container
# startup — it will fail the first Gemini call. Was previously
# transitive via meeting-transcription's optional google extra;
# THERAPY-71d5 dropped meeting-transcription, so pin explicitly.
google-genai = "^2.7.0"

# TOTP generation — pentest identity bootstrap (backend/app/jobs/pentest_identity.py)
# creates ephemeral MFA-enrolled Firebase users for the automated pentest.
pyotp = "^2.9.0"
opentelemetry-sdk = "^1.42.1"
opentelemetry-exporter-otlp-proto-http = "^1.42.1"
openinference-semantic-conventions = "^0.1.30"
python-docx = "^1.1.2"


[tool.poetry.group.pii]
optional = true

[tool.poetry.group.pii.dependencies]
faker = "^40.19.1"


# Eval harness (THERAPY-t0dj). Optional so OSS self-hosters who don't
# want to run evals locally aren't forced to install the Braintrust SDK.
# Enable with: poetry install --with evals
[tool.poetry.group.evals]
optional = true

[tool.poetry.group.evals.dependencies]
braintrust = ">=0.22.1"
openai = ">=2.38.0"
pyyaml = ">=6.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.12.0"
httpx = "^0.28.1"
ruff = "^0.15.14"
mypy = "^2.1.0"
types-redis = "^4.6.0"
# Was pulled in transitively by meeting-transcription before that dep
# was dropped (THERAPY-71d5); declare explicitly so mypy keeps its
# dateutil stubs.
types-python-dateutil = "^2.9.0"
mcp = "^1.27.1"
testcontainers = {version = "^4.13.0", extras = ["postgres"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python syntax)
    "S",      # flake8-bandit (security checks)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "PL",     # pylint (comprehensive checks)
    "PT",     # flake8-pytest-style
    "TID",    # flake8-tidy-imports
    "TC",     # flake8-type-checking (TYPE_CHECKING blocks)
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (prefer pathlib over os.path)
]

ignore = [
    "B008",     # Do not perform function calls in argument defaults (FastAPI Depends pattern)
    "TID252",   # Prefer absolute imports - relative imports are fine within packages
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = [
    "S101",     # Allow assert in tests
    "S105",     # Allow hardcoded passwords (test fixtures with token-like attribute names)
    "ARG001",   # Allow unused function args (pytest fixtures)
    "ARG002",   # Allow unused method args (pytest fixtures)
    "PLR0913",  # Allow many arguments (pytest fixture injection)
    "PLR2004",  # Allow magic values in tests (counts, small literals are self-documenting)
]
"backend/evals/**/*.py" = [
    "S101",     # Allow assert in eval harness tests
    "PLR0913",  # Allow many keyword-only args in eval entry points (run_eval orchestration)
    "PLR2004",  # Allow magic values in smoke tests (small fixed counts)
]
"backend/tests_integration/**/*.py" = [
    "S101",     # Allow assert in tests
    "ARG001",   # Allow unused function args (pytest fixtures)
    "PLR2004",  # Allow magic values in tests (counts, small literals are self-documenting)
]
"backend/app/models/**/*.py" = [
    "TC003",    # datetime import needed at runtime for Pydantic/dataclass field validation
]
"backend/app/outcome_measures/**/*.py" = [
    "TC001",    # enums imported from sibling modules used at runtime by Pydantic
    "TC003",    # datetime import needed at runtime for Pydantic field validation
    "PLR0913",  # Allow many arguments (FastAPI Depends injection)
]
"backend/app/diagnostics/**/*.py" = [
    "TC001",    # enums imported from sibling modules used at runtime by Pydantic
    "TC003",    # datetime import needed at runtime for Pydantic field validation
]
"backend/app/db/models.py" = [
    "TC003",    # datetime import needed at runtime for SQLAlchemy Mapped[] resolution
]
"backend/app/db/platform_models.py" = [
    "TC003",    # datetime import needed at runtime for SQLAlchemy Mapped[] resolution
]
"backend/app/db/saas_models.py" = [
    "TC003",    # datetime import needed at runtime for SQLAlchemy Mapped[] resolution
]
"backend/app/repositories/**/*.py" = [
    "TC003",    # datetime import needed at runtime for dataclass field definitions
]
"backend/app/scheduling_engine/**/*.py" = [
    "TC003",    # datetime import needed at runtime for dataclass field definitions
]
"backend/app/routes/**/*.py" = [
    "PLR0913",  # Allow many arguments (FastAPI Depends injection)
    "PLC0415",  # Lazy imports for conditional SaaS features and circular import avoidance
]
"backend/app/main.py" = [
    "PLC0415",  # Lazy import of background_sync (conditional, behind calendar_auto_sync guard)
]
"backend/app/auth/service.py" = [
    "PLC0415",  # Lazy import of subscription module (SaaS-only, behind is_saas guard)
]
"backend/app/auth/providers.py" = [
    "PLC0415",  # Lazy import of verify_firebase_token to avoid a circular import with service.py
]
"backend/app/services/**/*.py" = [
    "PLR0913",  # Allow many arguments (service functions with multiple dependencies)
    "PLC0415",  # Allow lazy imports for optional ML libraries (spacy, sentence_transformers, etc.)
]
"backend/plugins/**/*.py" = [
    "PLR0912",  # Allow many branches in plugin processing logic
]
"backend/alembic/**/*.py" = [
    "E501",     # Auto-generated migration files have long lines
    "I001",     # Import sorting in auto-generated code
    "W291",     # Trailing whitespace in auto-generated docstrings
]
"backend/app/db/**/*.py" = [
    "RUF012",   # SQLAlchemy __table_args__ are mutable class attrs by design
    "PLC0415",  # Lazy imports in provisioning to avoid circular imports
]
"backend/app/repositories/__init__.py" = [
    "PLC0415",  # Lazy imports in factory functions for conditional backends
]
"backend/scripts/**/*.py" = [
    "E501",     # Allow long lines in scripts (prompt text, CLI output)
    "S603",     # Allow subprocess calls in dev scripts
    "S607",     # Allow partial executable paths in dev scripts
    "PLC0415",  # Allow lazy imports in standalone scripts (conditional/env-dependent)
]
"security/**/*.py" = [
    "PLC0415",  # Allow lazy imports (MCP tool functions defer imports to avoid startup cost)
    "PLR0913",  # Allow many arguments (internal test orchestration functions)
    "PLR0911",  # Allow many returns (value type converters)
    "PLR2004",  # Allow magic values (HTTP status codes are self-documenting)
    "S603",     # Allow subprocess calls (gcloud CLI for rules drift check)
    "S607",     # Allow partial executable paths (gcloud)
    "PT028",    # Not pytest tests — functions named test_* are pentest tool functions
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # stubs differ between local/CI mypy versions
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pydantic.*",
    "google.cloud.*",
    "google.auth.*",
    "google.genai.*",
    "google.oauth2.*",
    "firebase_admin.*",
    "redis.*",
    "reportlab.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "faker.*",
    "spacy.*",
    "negspacy",
    "negspacy.*",
    "sentence_transformers.*",
    "onnxruntime.*",
    "torch.*",
    "datasets.*",
    "sklearn.*",
    "scipy.*",
    "icalendar.*",
    "sqlalchemy.*",
    "alembic.*",
    "httpx.*",
    "websockets.*",
    "pyotp.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=backend/app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "spacy: tests requiring a spaCy model (en_core_web_lg)",
    "gcp: tests requiring GCP credentials / connectivity",
]
