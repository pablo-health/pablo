# The load balancer in front of a practice's own hosts, for the end-to-end
# stack (docker-compose.e2e.yml, service practice-host-lb).
#
# A deployed practice host reaches the same frontend and backend as the app
# host, split by path the same way: the frontend's own API routes go to the
# frontend, every other /api path to the backend, everything else to the
# frontend. The portal page on a practice host therefore calls the API on its
# own origin. This mirrors that split so practice-own-host.spec.ts can prove
# it; the frontend and backend share the backend service's network namespace.
#
# The Host header is passed through untouched: it is how the frontend knows
# which practice the request is for.

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /api/config {
        proxy_pass http://backend:3000;
    }

    location = /api/login {
        proxy_pass http://backend:3000;
    }

    location = /api/logout {
        proxy_pass http://backend:3000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_pass http://backend:3000;
    }
}
